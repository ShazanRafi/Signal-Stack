[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-stack"
version = "0.1.0"
description = "AI-powered company intelligence and market signal monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.15.0",
    "feedparser==6.0.14",
    "httpx==0.28.1",
    "langchain-core==1.8.4",
    "langchain-google-genai==4.5.2",
    "langgraph==1.2.24",
    "Markdown==3.11.3",
    "openpyxl==3.1.5",
    "protego==0.7.0",
    "pydantic==2.14.4",
    "pypdf==7.1.1",
    "python-dotenv==1.2.4",
    "streamlit==1.67.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]
